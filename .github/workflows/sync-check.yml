name: Check uv.lock and generated requirements sync

on:
  push:
    paths:
      # Konflux may update uv.lock without regenerating these exports.
      - 'pyproject.toml'
      - 'Makefile'
      - 'requirements-build.in'
      - 'requirements.txt'
      - 'requirements-build.txt'
  pull_request:
    paths:
      # Konflux may update uv.lock without regenerating these exports.
      - 'pyproject.toml'
      - 'Makefile'
      - 'requirements-build.in'
      - 'requirements.txt'
      - 'requirements-build.txt'

concurrency:
  group: ${{ github.ref_name }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check-sync:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream9
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      run: dnf install -y gcc make cmake cargo libffi-devel python3.12-devel python3.12-wheel python3.12-pip diffutils

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        python-version: 3.12

    - name: Ensure pybuild-deps cache directory exists
      run: mkdir -p ~/.cache/pybuild-deps

    - name: Copy generated requirements for comparison
      run: |
        cp requirements.txt requirements-original.txt
        cp requirements-build.txt requirements-build-original.txt

    - name: Regenerate requirements from uv.lock
      run: |
        make generate-requirements

    - name: Compare regenerated files with originals
      run: |
        if ! diff -u requirements-original.txt requirements.txt || ! diff -u requirements-build-original.txt requirements-build.txt; then
          echo "ERROR: generated requirements are not in sync with uv.lock"
          echo ""
          echo "The differences above show what needs to be updated."
          echo "To fix this, run: make generate-requirements"
          exit 1
        else
          echo "Generated requirements are in sync with uv.lock"
        fi
